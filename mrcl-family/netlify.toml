[build]
  publish = "public"
  # Writes public/config.generated.js from the environment variables, so every
  # device that loads the site is already configured.
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Old home-screen icons and bookmarks still point at the previous page name.
[[redirects]]
  from = "/mobile-update.html"
  to = "/add"
  status = 301
  force = true

[[redirects]]
  from = "/add"
  to = "/add.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
    # The family list is not for search engines.
    X-Robots-Tag = "noindex, nofollow"

# The generated config must never be cached, or a redeploy would leave a device
# holding the previous project's keys.
[[headers]]
  for = "/config.generated.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
