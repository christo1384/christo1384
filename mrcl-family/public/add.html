<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Add · The MRCL family Week</title>
    <meta name="description" content="Add something to the family week." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/add.css" />
    <script src="/config.generated.js"></script>
  </head>
  <body class="add">
    <div data-app>
      <header class="add-header">
        <h1 data-board-title>The MRCL family Week</h1>
        <a href="/">See the board</a>
      </header>

      <form class="card" data-form novalidate>
        <h2 class="visually-hidden" data-form-title>Add to the week</h2>

        <div class="field">
          <label for="title">What is it?</label>
          <input id="title" name="title" type="text" maxlength="120" required autocomplete="off"
                 placeholder="Soccer practice" />
        </div>

        <div class="field">
          <label for="category">Which row?</label>
          <select id="category" name="category"></select>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="date">Date</label>
            <input id="date" name="date" type="date" required />
          </div>
          <div class="field">
            <label for="time">Time <span aria-hidden="true">(optional)</span></label>
            <input id="time" name="time" type="time" />
          </div>
        </div>

        <div class="field">
          <label for="who">Who is it for? <span aria-hidden="true">(optional)</span></label>
          <input id="who" name="who" type="text" maxlength="40" autocomplete="off" placeholder="Ruby" />
        </div>

        <div class="field check" data-annual-field hidden>
          <input id="annual" name="annual" type="checkbox" />
          <label for="annual">Every year</label>
        </div>

        <button class="primary" type="submit" data-submit>Add to the week</button>
        <button class="ghost" type="button" data-cancel hidden>Cancel</button>
        <p class="message" data-message role="status" aria-live="polite"></p>
      </form>

      <nav class="week-nav" aria-label="Week">
        <button type="button" data-prev aria-label="Previous week">←</button>
        <span class="week-range" data-week-range></span>
        <button type="button" data-next aria-label="Next week">→</button>
      </nav>
      <button class="ghost" type="button" data-today hidden>Back to this week</button>

      <div data-list></div>
    </div>

    <div class="setup" data-setup hidden>
      <h1>Nearly there</h1>
      <p>
        This deploy has no Firebase configuration, so there is nothing to add to yet.
        Missing: <span class="missing" data-setup-missing></span>.
      </p>
      <p>Set <code>FIREBASE_CONFIG</code> in the Netlify environment variables and redeploy — see <code>docs/DEPLOY.md</code>.</p>
    </div>

    <script type="module" src="/js/add.js"></script>
  </body>
</html>
