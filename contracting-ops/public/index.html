<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ops">
<title>Contracting Ops</title>
<link rel="stylesheet" href="/styles.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-180.png">
</head>
<body>
<header class="topbar" id="topbar" hidden>
  <div class="topbar-inner">
    <a class="brand" href="#/dashboard"><img class="brand-mark" src="/icon-180.png" alt=""> Contracting Ops</a>
    <nav class="tabs">
      <a href="#/dashboard" data-tab="dashboard">Dashboard</a>
      <a href="#/jobs" data-tab="jobs">Jobs</a>
      <a href="#/expenses" data-tab="expenses">Money</a>
      <a href="#/reports" data-tab="reports">Reports</a>
      <a href="#/clients" data-tab="clients">Clients</a>
    </nav>
    <button class="btn btn-primary btn-sm" id="new-expense-btn" type="button">Add expense</button>
    <button class="btn btn-sm" id="account-btn" type="button">Account</button>
  </div>
</header>

<main id="view" class="view" aria-live="polite"></main>

<dialog id="modal" class="modal">
  <form method="dialog" id="modal-form">
    <h2 id="modal-title"></h2>
    <div id="modal-fields"></div>
    <p class="form-error" id="modal-error" hidden></p>
    <menu class="modal-actions">
      <button class="btn" value="cancel" type="submit" formnovalidate>Cancel</button>
      <button class="btn btn-primary" id="modal-save" value="save" type="button">Save</button>
    </menu>
  </form>
</dialog>

<dialog id="lightbox" class="lightbox">
  <img id="lightbox-img" alt="Receipt">
  <menu class="modal-actions">
    <button class="btn" id="lightbox-close" type="button">Close</button>
  </menu>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
